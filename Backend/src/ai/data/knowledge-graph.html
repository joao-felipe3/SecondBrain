<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <title>SecondBrain - Knowledge Graph Visualizer</title>
  <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #090d16;
      color: #f8fafc;
      overflow: hidden;
    }

    #header {
      height: 64px;
      padding: 12px 24px;
      background: #111827;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #1f2937;
    }

    #main-container {
      display: flex;
      width: 100vw;
      height: calc(100vh - 64px);
    }

    #mynetwork {
      flex: 1;
      height: 100%;
    }

    #side-panel {
      width: 400px;
      height: 100%;
      background: #111827;
      border-left: 1px solid #1f2937;
      padding: 20px;
      overflow-y: auto;
      display: none;
      flex-direction: column;
      gap: 16px;
      box-shadow: -4px 0 24px rgba(0, 0, 0, 0.5);
    }

    #side-panel.active {
      display: flex;
    }

    .toolbar-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #f3f4f6;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .toolbar-btn:hover {
      background: #374151;
      border-color: #4b5563;
    }

    .toolbar-btn.active {
      background: #2563eb;
      border-color: #3b82f6;
      color: #fff;
    }

    .type-tag {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .type-module {
      background: #ec4899;
      color: #fff;
    }

    .type-controller {
      background: #10b981;
      color: #fff;
    }

    .type-service {
      background: #3b82f6;
      color: #fff;
    }

    .type-document {
      background: #f59e0b;
      color: #fff;
    }

    .content-box {
      background: #030712;
      border: 1px solid #1f2937;
      border-radius: 8px;
      padding: 12px;
      font-family: monospace;
      font-size: 11px;
      white-space: pre-wrap;
      max-height: 320px;
      overflow-y: auto;
      color: #e5e7eb;
    }

    .close-btn {
      align-self: flex-end;
      background: transparent;
      border: none;
      color: #9ca3af;
      font-size: 18px;
      cursor: pointer;
    }

    .close-btn:hover {
      color: #fff;
    }

    #search-input {
      background: #030712;
      border: 1px solid #374151;
      color: #fff;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 13px;
      width: 200px;
    }
  </style>
</head>

<body>
  <div id="header">
    <div style="display:flex; align-items:center; gap:16px;">
      <h3 style="margin: 0; color:#60a5fa;">🧠 SecondBrain Knowledge Graph</h3>
      <span style="font-size: 12px; color: #9ca3af;" id="graph-stats">261 nós • 626 conexões</span>
    </div>

    <div style="display:flex; align-items:center; gap:12px;">
      <input type="text" id="search-input" placeholder="🔍 Buscar nó..." oninput="searchNode(this.value)" />
      <button class="toolbar-btn active" id="btn-isolated" onclick="toggleIsolated()"><span>👁️</span> Ocultar
        Isolados</button>
      <button class="toolbar-btn" id="btn-layout" onclick="toggleLayout()"><span>🌲</span> Layout Hierárquico</button>
    </div>
  </div>

  <div id="main-container">
    <div id="mynetwork"></div>
    <div id="side-panel">
      <button class="close-btn" onclick="closePanel()">✕</button>
      <div id="panel-body">
        <p style="color:#9ca3af;">Clique em um nó para visualizar os detalhes e dependências.</p>
      </div>
    </div>
  </div>

  <script type="text/javascript">
    const rawNodes = [{ "id": "Project/adr/001-why-nestjs-mongoose.md", "label": "001-why-nestjs-mongoose.md", "title": "<b>001-why-nestjs-mongoose.md</b><br/><i>document</i>", "group": "document", "path": "Project/adr/001-why-nestjs-mongoose.md", "content": "# ADR-001: Backend com NestJS + Mongoose\r\n\r\n## Contexto\r\nO SecondBrain tem um backend TypeScript com responsabilidades crescentes e domínio rico:\r\n\r\n- **Tarefas**: CRUD e estados (MVP) + micro-tarefas com checklist padrão-ouro, PERT em micro-escala e recorrência.\r\n- **Projetos**: CRUD + associação de tarefas.\r\n- **LLM/IA**: geração e revisão de sugestões (tarefas, WBS/EAP, estimativas PERT, dependências, feedback).\r\n\r\nOs requisitos enfatizam **modularidade, testabilidade e consistência**\r\n\r\nO datastore alvo é **MongoDB**, e o domínio exige:\r\n\r\n- Modelos com campos opcionais/variáveis (tarefas, projetos, configurações)\r\n- Estruturas hierárquicas e arrays (ex.: WBS)\r\n- Validação de forma e regras de negócio (DTO + schema)\r\n- Facilidade para testes (unit + integração + e2e)\r\n\r\n## Decisão\r\nAdotar **NestJS** como framework do backend e **Mongoose** como ODM para MongoDB (via `@nestjs/mongoose`).\r\n\r\n## Drivers (por que essa escolha atende os requisitos)\r\n- **Arquitetura modular**: encaixa com separação por domínio (ver ADR-002).\r\n- **Injeção de dependência**: facilita orquestração, mock e testes isolados.\r\n- **TypeScript-first**: DTOs, pipes/guards e tipagem consistente ao longo do request/response.\r\n- **Validação em camadas**: class-validator nos DTOs + validação/constraints no schema.\r\n- **Modelagem Mongo nativa**: subdocumentos, arrays, índices e validações customizadas.\r\n- **Ecossistema e maturidade**: integrações Nest para config, logging, testes, OpenAPI, etc.\r\n\r\n## Detalhes ", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Project/adr/002-module-separation.md", "label": "002-module-separation.md", "title": "<b>002-module-separation.md</b><br/><i>document</i>", "group": "document", "path": "Project/adr/002-module-separation.md", "content": "# ADR-002: Separação de Módulos por Domínio\r\n\r\n## Contexto\r\nOs requisitos do SecondBrain cobrem domínios com mudanças e complexidade diferentes:\r\n\r\n- **Tasks**: CRUD, recorrência, checklist, PERT micro, Kanban/fluxo.\r\n- **Projects**: CRUD, associação com tasks, WBS/EAP, PERT/CPM, Gantt, X-Matrix.\r\n- **Settings**: configurações do usuário e do sistema.\r\n\r\nSem limites claros, o backend tende a:\r\n\r\n- acumular regras de negócio em poucos arquivos,\r\n- criar acoplamento acidental,\r\n- dificultar testes e refactors.\r\n\r\n\r\n## Decisão\r\nOrganizar o backend em módulos por domínio:\r\n\r\n- `TasksModule`\r\n- `ProjectsModule` (com subáreas como planning/WBS quando fizer sentido)\r\n- `SettingsModule`\r\n\r\nAlém disso, manter módulos transversais (ex.: config e infraestrutura) **sem** misturar regras de domínio.\r\n\r\n## Onde no código\r\n- Modules (Nest): [Backend/src/tasks/tasks.module.ts](../../Backend/src/tasks/tasks.module.ts), [Backend/src/projects/projects.module.ts](../../Backend/src/projects/projects.module.ts), [Backend/src/settings/settings.module.ts](../../Backend/src/settings/settings.module.ts)\r\n\r\n## Regras de fronteira (guardrails)\r\n- Controllers e DTOs ficam no módulo do domínio.\r\n- Services de domínio não importam detalhes internos de outros módulos; quando necessário:\r\n  - expor apenas o que é estável via `exports` do módulo,\r\n  - ou criar um “orquestrador”/service de aplicação que coordena fluxos cross-domain.\r\n- `forwardRef()` é permitido como exceção (hoje há um ciclo conhecido Tasks ↔", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Project/adr/003-gemini-integration.md", "label": "003-gemini-integration.md", "title": "<b>003-gemini-integration.md</b><br/><i>document</i>", "group": "document", "path": "Project/adr/003-gemini-integration.md", "content": "# ADR-003: Integração com Gemini API\r\n\r\n## Contexto\r\nO SecondBrain usa LLM como parte do **core do produto**, não como “extra”. Nos requisitos, a IA suporta:\r\n\r\n- geração/edição/aceite de sugestões (MVP - Integração com IA),\r\n- Catchball (perguntas estratégicas), objetivos SMART,\r\n- geração e decomposição de WBS/EAP (com regra 8/80),\r\n- identificação de dependências e suporte a PERT/CPM,\r\n- micro-tarefas com checklists padrão-ouro e feedback.\r\n\r\nIsso exige uma integração **consistente**, com **guardrails** para:\r\n\r\n- validação de saída,\r\n- previsibilidade do formato,\r\n- retries/timeouts,\r\n- observabilidade,\r\n- e proteção contra vazamento de dados sensíveis.\r\n\r\n## Decisão\r\nIntegrar a Gemini API por meio de uma camada de serviço centralizada (ex.: `GeminiService`), responsável por:\r\n\r\n- montar prompts de forma padronizada,\r\n- escolher/configurar modelo,\r\n- lidar com erros/retries/timeouts,\r\n- validar e normalizar outputs,\r\n- expor métodos “de domínio” (ex.: checklist, estimativas PERT, embeddings), em vez de respostas genéricas.\r\n\r\n## Detalhes (como isso se aplica no backend)\r\n- A camada de IA é consumida por services do domínio (principalmente `TasksModule` e `ProjectsModule`), evitando chamadas diretas em controllers.\r\n- Toda saída de IA relevante ao domínio deve ser:\r\n  - parseada para estrutura esperada,\r\n  - validada (shape + constraints),\r\n  - e ter fallback quando inválida.\r\n\r\n## Onde no código\r\n- Serviço central: [Backend/src/ai/gemini.service.ts](../../Backend/src/ai/g", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Project/DEVOPS_REFACTORING_PLAN.md", "label": "DEVOPS_REFACTORING_PLAN.md", "title": "<b>DEVOPS_REFACTORING_PLAN.md</b><br/><i>document</i>", "group": "document", "path": "Project/DEVOPS_REFACTORING_PLAN.md", "content": "# DevOps Refactoring Plan - Phase 2.5\n\n## Objetivo\n\nEstruturar documentação, melhorar CI/CD, implementar best practices de arquitetura e preparar para escalabilidade.\n\n## Sprint 1: Documentação de Base ✅ CONCLUÍDO (30/30h)\n\n### ADRs (Architecture Decision Records)\n\n#### ✅ ADR-001: NestJS + Mongoose\n\n- **Decisão**: Usar NestJS com Mongoose como framework + ODM\n- **Rationale**: Modularidade, type safety, suporte maduro, ecosistema rich\n- **Aceitação**: ✅ Implementado\n- **Detalhes**: `docs/adr/ADR-001-nestjs-mongoose.md`\n\n#### ✅ ADR-002: Separação de Módulos por Domínio\n\n- **Decisão**: Tasks, Projects, Settings como módulos independentes\n- **Rationale**: Separação de concerns, reutilização, facilita testes\n- **Aceitação**: ✅ Implementado\n- **Detalhes**: `docs/adr/ADR-002-module-separation.md`\n\n#### ✅ ADR-003: Estratégia de Validação em 3 Camadas\n\n- **Decisão**: DTO validators + Mongoose schemas + Joi para env vars\n- **Rationale**: Validação em diferentes níveis, type safety, clareza\n- **Aceitação**: ✅ Implementado\n- **Detalhes**: `docs/adr/ADR-003-validation-strategy.md`\n\n#### ✅ ADR-005: Integração Gemini API\n\n- **Decisão**: Gemini para sugestões de tarefas, estimativas PERT, embeddings\n- **Rationale**: IA nativa, baixa latência, custo-benefício, sem overhead self-hosted\n- **Aceitação**: ✅ Implementado\n- **Detalhes**: `docs/adr/ADR-005-gemini-integration.md`\n\n### C4 Architecture Diagrams\n\n#### ✅ System Context (c4-system-context.puml)\n\n- Usuários, SecondBrain, Google Gemini, Mon", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Project/REQUISITOS.md", "label": "REQUISITOS.md", "title": "<b>REQUISITOS.md</b><br/><i>document</i>", "group": "document", "path": "Project/REQUISITOS.md", "content": "# 📋 Acompanhamento de Requisitos - Second Brain\r\n\r\n> **Última atualização:** 06/07/2026  \r\n> **Status do Projeto:** MVP + Fase 1 + Fase 2 100% Completas\r\n\r\n---\r\n\r\n## 📊 Resumo do Progresso\r\n\r\n| Fase | Total | Prototipado | Frontend | Backend | QA | Progresso |\r\n|------|-------|-------------|----------|---------|-----|-----------|\r\n| Fase 0 - MVP | 14 | 14/14 ✅ | 14/14 ✅ | 14/14 ✅ | 14/14 ✅ | 🟢 100% |\r\n| Fase 1 - Eficiência | 29 | 29/29 ✅ | 29/29 ✅ | 29/29 ✅ | 29/29 ✅ | 🟢 100% |\r\n| Fase 2 - Micro-Tarefas | 22 | 22/22 ✅ | 22/22 ✅ | 22/22 ✅ | 22/22 ✅ | 🟢 100% |\r\n| Fase 2.5 - DevOps & Refactoring | 38 | 0/38 | Docs | 0/38 | 0/38 | ⬜ 0% |\r\n| Fase 3 - Produtividade Avançada | 22 | 0/22 | 0/22 | 0/22 | 0/22 | ⬜ 0% |\r\n| Fase 4 - Gamificação Essencial | 25 | 0/25 | 0/25 | 0/25 | 0/25 | ⬜ 0% |\r\n| Fase 5 - Criação de Projetos com Agente | 9 | 0/9 | 0/9 | 0/9 | 0/9 | ⬜ 0% |\r\n| Fase 6 - Rotina Invisível, Âncoras e Desligamento | 31 | 0/31 | 0/31 | 0/31 | 0/31 | ⬜ 0% |\r\n| Fase 7 - Narrativa e Motor RPG | 42 | 0/42 | 0/42 | 0/42 | 0/42 | ⬜ 0% |\r\n| Fase 8 - Monitoramento e Interpretação Assistida | 10 | 0/10 | 0/10 | 0/10 | 0/10 | ⬜ 0% |\r\n| Fase 9 - Arquitetura Cognitiva | 28 | 0/28 | 0/28 | 0/28 | 0/28 | ⬜ 0% |\r\n| Fase 10 - IA Autônoma e Guardião do OS | 36 | 0/36 | 0/36 | 0/36 | 0/36 | ⬜ 0% |\r\n| Fase 11 - Espelho Metacognitivo e Energia Biológica | 44 | 0/44 | 0/44 | 0/44 | 0/44 | ⬜ 0% |\r\n| Fase 12 - Polimento e Segurança | 10 | 0/10 | 0/10 | 0/10 | 0/10 | ⬜ 0% |\r\n| Fase 13 - Agentes T", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/llm-wiki/overview.md", "label": "overview.md", "title": "<b>overview.md</b><br/><i>document</i>", "group": "document", "path": "Backend/llm-wiki/overview.md", "content": "# SecondBrain Backend Architecture Overview\n\n## Visão Geral\nO SecondBrain é uma plataforma de gestão inteligente de projetos e tarefas orientada a resultados e rastreabilidade estratégica.\n\n## Estrutura de Módulos (NestJS)\n\n- **`ProjectsModule`**: Gestão macro de projetos, WBS (Work Breakdown Structure), Matriz X e Planejamento em Ondas (Rolling Wave).\n- **`TasksModule`**: Gestão micro de tarefas, estimativas PERT, métricas EVM, inferência de dependências (CPM), kanban e checklists IA.\n- **`AIModule`**: Integrações com Google Gemini para suporte estocástico, geração de WBS, sugestões de micro-tarefas e RAG via Wiki.\n- **`SettingsModule`**: Configurações de preferências do usuário e notificações.\n\n## Grafo de Relacionamento de Módulos\n```mermaid\ngraph TD\n    ProjectsModule --> TasksModule\n    TasksModule --> AIModule\n    ProjectsModule --> AIModule\n    SettingsModule --> TasksModule\n```\n", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/llm-wiki/tasks-analysis.md", "label": "tasks-analysis.md", "title": "<b>tasks-analysis.md</b><br/><i>document</i>", "group": "document", "path": "Backend/llm-wiki/tasks-analysis.md", "content": "# Módulo: Análise Quantitativa e PERT/CPM\n\n## Descrição\nResponsável pelo cálculo estocástico de estimativas de tempo (PERT), análise de caminho crítico (CPM) e métricas agregadas de valor agregado (EVM).\n\n## Principais Serviços\n- **`PertService`**: Cálculo da duração esperada Beta \\(E = \\frac{O + 4M + P}{6}\\) e variância.\n- **`MetricsService`**: Métricas agregadas de tempo e progresso do projeto.\n- **`CPMService`**: Inferência de dependências operacionais e caminho crítico do projeto.\n", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/llm-wiki/tasks-dependencies.md", "label": "tasks-dependencies.md", "title": "<b>tasks-dependencies.md</b><br/><i>document</i>", "group": "document", "path": "Backend/llm-wiki/tasks-dependencies.md", "content": "# `tasks/services/dependencies/` — Guia de Referência\r\n\r\n## Visão Geral\r\n\r\nA pasta `dependencies/` reúne os serviços e utilitários responsáveis por **análise crítica de rede, hierarquia e inferência de dependências** entre tarefas. Cobre três domínios funcionais:\r\n\r\n| Domínio | Sigla | O que faz |\r\n|---------|-------|-----------|\r\n| Critical Path Method | **CPM** | Calcula caminho crítico, folgas, ES/EF/LS/LF e diagnósticos |\r\n| Dependency Inference | **DI** | Infere dependências entre tarefas via heurísticas e IA (Gemini) |\r\n| Hierarchy | **H** | Navega e calcula linhagem, descendentes e contribuição de XP por subárvore |\r\n\r\n### Pipeline de Processamento CPM e Inferência\r\n\r\n```mermaid\r\ngraph TD\r\n    A[\"Lista de Tarefas do Projeto\"] --> B[\"CPM Engine: calculateCriticalPath\"]\r\n    \r\n    subgraph CPMEngine [Engine CPM - Análise de Rede]\r\n        B --> C[\"Passo 1: Conversão min -> horas\"]\r\n        C --> D[\"Passo 2: Construção do Mapa de Arestas\"]\r\n        D --> E[\"Passo 3: Ordenação Topológica Kahn BFS\"]\r\n        E --> F[\"Passo 4: Repasse de Ida - Forward Pass\"]\r\n        F --> F1[\"EF = ES + Duração\"]\r\n        F --> F2[\"ES(sucessor) = max(EF(predecessores))\"]\r\n        E --> G[\"Passo 5: Repasse de Volta - Backward Pass\"]\r\n        G --> G1[\"LS = LF - Duração\"]\r\n        G --> G2[\"LF(predecessor) = min(LS(sucessores))\"]\r\n        \r\n        F & G --> H[\"Passo 6: Cálculo de Folga - Slack\"]\r\n        H --> H1[\"Folga = LF - EF\"]\r\n        H --> I[\"Passo 7: Classificação em Baldes de Folgas ", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/llm-wiki/tasks-intelligence.md", "label": "tasks-intelligence.md", "title": "<b>tasks-intelligence.md</b><br/><i>document</i>", "group": "document", "path": "Backend/llm-wiki/tasks-intelligence.md", "content": "# Módulo: Inteligência e Suporte com IA\n\n## Descrição\nFornece recursos inteligentes alimentados pelo Google Gemini para decomposição de objetivos SMART, geração de checklists automatizados e sugestões de micro-tarefas com streaming SSE.\n\n## Principais Serviços\n- **`AiSuggestionsService`**: Sugestões inteligentes via SSE.\n- **`ChecklistService`**: Checklists acionáveis por tipo de micro-tarefa.\n- **`FeedbackService`**: Coleta de utilidade das sugestões.\n", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/llm-wiki/tasks-monitoring.md", "label": "tasks-monitoring.md", "title": "<b>tasks-monitoring.md</b><br/><i>document</i>", "group": "document", "path": "Backend/llm-wiki/tasks-monitoring.md", "content": "# Módulo: Monitoramento e Alertas Operacionais\n\n## Descrição\nMonitoramento proativo de desvios de prazos e alertas no fluxo de execução de tarefas.\n\n## Principais Serviços\n- **`AlertsService`**: Gerenciamento de alertas operacionais com suporte a leitura, filtros por projeto/usuário e hints de performance Mongoose.\n", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/llm-wiki/tasks-traceability.md", "label": "tasks-traceability.md", "title": "<b>tasks-traceability.md</b><br/><i>document</i>", "group": "document", "path": "Backend/llm-wiki/tasks-traceability.md", "content": "# Módulo: Rastreabilidade e Matriz RTM\n\n## Descrição\nResponsável pelo vínculo bidirecional entre requisitos da jornada do projeto e as tarefas operacionais no Kanban (Requirements Traceability Matrix - RTM).\n\n## Principais Serviços\n- **`RTMCrudService`**: Associação, desacoplamento e sincronização entre itens da jornada e tarefas.\n- **`RequirementMapper`**: Transformação entre entidades Mongoose e DTOs de rastreabilidade.\n\n## Integridade e Validação\n- Garante que cada micro-tarefa criada via WBS possua rastreabilidade com o objetivo SMART pai.\n", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/llm-wiki/tasks-workflow.md", "label": "tasks-workflow.md", "title": "<b>tasks-workflow.md</b><br/><i>document</i>", "group": "document", "path": "Backend/llm-wiki/tasks-workflow.md", "content": "# Módulo: Workflow de Tarefas\n\n## Descrição\nGerencia a criação, atualização, transição de estados no Kanban, pomodoros e tarefas recorrentes.\n\n## Principais Serviços\n- **`TasksWriteService`**: CRUD e atualização com cálculo derivado de campos e estatísticas.\n- **`TasksCompletionService`**: Conclusão operacional de tarefas e transição de colunas no Kanban.\n- **`TasksRecurringService`**: Gerenciamento de tarefas recorrentes com cálculo de próximos ciclos.\n- **`TasksInputService`**: Resolução e sanitização de dados de entrada de tarefas.\n\n## Endpoints REST\n- `POST /tasks`: Criação de tarefa\n- `PATCH /tasks/:id/conclude`: Marcação como concluída\n- `PATCH /tasks/:id/increment-pomodoro`: Incremento de pomodoros executados\n", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/src/tasks/services/analysis/README.md", "label": "README.md", "title": "<b>README.md</b><br/><i>document</i>", "group": "document", "path": "Backend/src/tasks/services/analysis/README.md", "content": "# Tasks Analysis Services\n\n## Visão Geral\nEste módulo contém serviços especializados na análise quantitativa e estocástica de tarefas dentro do SecondBrain. Ele integra técnicas consagradas de engenharia e gestão de projetos, como **PERT (Program Evaluation and Review Technique)**, **CPM (Critical Path Method)** e **EVM (Earned Value Management)**.\n\n## Serviços Principais\n\n### `PertService` (`pert.service.ts`)\n- **Objetivo**: Calcular estimativas probabilísticas de duração de tarefas usando a distribuição Beta (otimista, mais provável, pessimista).\n- **Métricas**:\n  - Duração Esperada: \\(E = \\frac{O + 4M + P}{6}\\)\n  - Variância: \\(V = \\left(\\frac{P - O}{6}\\right)^2\\)\n  - Desvio Padrão: \\(\\sigma = \\sqrt{V}\\)\n\n### `MetricsService` (`metrics.service.ts`)\n- **Objetivo**: Calcular indicadores operacionais agregados de progresso e desempenho de execução.\n- **Responsabilidades**: Agregação de estimativas de tempo, contagem de pomodoros concluídos e alinhamento com prazos.\n\n## Integrações\n- Consumido pelo `TasksController` para atualização de estimativas via `POST /tasks/:id/pert-estimate`.\n- Consumido pelo `ProjectsModule` para renderização de diagramas Gantt e análise de caminho crítico (CPM).\n", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/src/tasks/services/intelligence/README.md", "label": "README.md", "title": "<b>README.md</b><br/><i>document</i>", "group": "document", "path": "Backend/src/tasks/services/intelligence/README.md", "content": "# Tasks Intelligence Services\n\n## Visão Geral\nO módulo de Inteligência de Tarefas agrupa serviços que utilizam o modelo de IA **Google Gemini** para potencializar o planejamento operacional, decomposição funcional e enriquecimento automático de micro-tarefas.\n\n## Serviços Principais\n\n### `AiSuggestionsService` (`ai-suggestions.service.ts`)\n- **Objetivo**: Gerar sugestões contextualizadas de micro-tarefas com base nos objetivos do projeto e histórico recente.\n- **Suporte a Streaming**: Integração via SSE (Server-Sent Events) no endpoint `GET /tasks/ai-suggestions-stream`.\n\n### `ChecklistService` (`checklist.service.ts`)\n- **Objetivo**: Autogerar checklists operacionais acionáveis para micro-tarefas com base no tipo (`habit`, `complex`, `quick`, `subtask`) e padrão de execuções anteriores.\n\n### `FeedbackService` (`feedback.service.ts`)\n- **Objetivo**: Coletar feedback de aceitação/rejeição do usuário sobre sugestões de IA para ajuste contínuo de relevância.\n\n## Segurança e Guardrails\n- Sanitização rigorosa de entradas JSON via `json-sanitizer.util.ts`.\n- Filtros de NoSQL Injection em todas as queries com casting explícito de IDs (`String()` e `new Types.ObjectId()`).\n", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/src/tasks/services/monitoring/README.md", "label": "README.md", "title": "<b>README.md</b><br/><i>document</i>", "group": "document", "path": "Backend/src/tasks/services/monitoring/README.md", "content": "# Tasks Monitoring Services\n\n## Visão Geral\nEste módulo é responsável por monitorar a saúde operacional das tarefas, gerando alertas de desvio de prazo, gargalos no caminho crítico e notificações proativas para o usuário.\n\n## Serviços Principais\n\n### `AlertsService` (`alerts.service.ts`)\n- **Objetivo**: Gerenciar o ciclo de vida dos alertas operacionais de tarefas.\n- **Funcionalidades**:\n  - Listagem filtrada por usuário, projeto e status de leitura (`unreadOnly`).\n  - Marcação de alertas como lidos (`markRead`).\n  - Dica de índice Mongoose (`hint({ userId: 1, isRead: 1, createdAt: -1 })`) para alta performance de consulta.\n\n## Métricas e Notificações\n- Alertas acionados quando o desvio estimado PERT excede os limites de segurança da onda planejada.\n- Notificações integradas com o sistema de alertas em tempo real.\n", "color": { "background": "#f59e0b", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 20 }, { "id": "Backend/src/ai/ai.module.ts", "label": "ai.module.ts", "title": "<b>ai.module.ts</b><br/><i>module</i>", "group": "module", "path": "Backend/src/ai/ai.module.ts", "content": "import { Module, Global } from '@nestjs/common';\nimport { GeminiService } from './services/core/gemini.service';\nimport { GeminiExecutorService } from './services/core/gemini-executor.service';\nimport { ChecklistAiService } from './services/tasks/checklist-ai.service';\nimport { PertAiService } from './services/tasks/pert-ai.service';\nimport { SuggestionsAiService } from './services/tasks/suggestions-ai.service';\nimport { DependencyAiService } from './services/tasks/dependency-ai.service';\nimport { PromptBuilderService } from './services/projects/prompt-builder.service';\nimport { DraftsAiService } from './services/tasks/drafts-ai.service';\nimport { RollingWaveAIService } from './services/projects/rolling-wave-ai.service';\nimport { WbsAiService } from './services/projects/wbs-ai.service';\nimport { AiWikiService } from './services/wiki/ai-wiki.service';\nimport { AiWikiController } from './controllers/wiki/ai-wiki.controller';\n\n@Global()\n@Module({\n  controllers: [AiWikiController],\n  provi", "color": { "background": "#ec4899", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 26 }, { "id": "Backend/src/ai/controllers/wiki/ai-wiki.controller.ts", "label": "ai-wiki.controller.ts", "title": "<b>ai-wiki.controller.ts</b><br/><i>controller</i>", "group": "controller", "path": "Backend/src/ai/controllers/wiki/ai-wiki.controller.ts", "content": "import { Body, Controller, HttpCode, HttpStatus, Post } from '@nestjs/common';\nimport { ApiOperation, ApiResponse, ApiTags } from '@nestjs/swagger';\nimport { AiWikiService } from '../../services/wiki/ai-wiki.service';\nimport { WikiQueryDto, WikiQueryResponseDto } from '../../dto/wiki-query.dto';\n\n@ApiTags('ai-wiki')\n@Controller('ai/wiki-query')\nexport class AiWikiController {\n  constructor(private readonly aiWikiService: AiWikiService) {}\n\n  @Post()\n  @HttpCode(HttpStatus.OK)\n  @ApiOperation({ summary: 'Consulta semântica e Graph RAG na documentação e código do repositório' })\n  @ApiResponse({ status: 200, description: 'Resposta sintetizada com fontes e subgrafo' })\n  async queryWiki(@Body() dto: WikiQueryDto): Promise<WikiQueryResponseDto> {\n    return this.aiWikiService.queryWiki(dto);\n  }\n}\n", "color": { "background": "#10b981", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/dto/wiki-query.dto.ts", "label": "wiki-query.dto.ts", "title": "<b>wiki-query.dto.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/dto/wiki-query.dto.ts", "content": "import { IsNotEmpty, IsNumber, IsOptional, IsString, Max, Min } from 'class-validator';\n\nexport class WikiQueryDto {\n  @IsString()\n  @IsNotEmpty()\n  query: string;\n\n  @IsOptional()\n  @IsNumber()\n  @Min(1)\n  @Max(20)\n  topK?: number;\n\n  @IsOptional()\n  @IsNumber()\n  @Min(1)\n  @Max(3)\n  maxDepth?: number;\n}\n\nexport interface WikiSourceDto {\n  path: string;\n  score: number;\n  snippet: string;\n}\n\nexport interface GraphNodeDto {\n  id: string;\n  label: string;\n  type: string;\n}\n\nexport interface GraphEdgeDto {\n  source: string;\n  target: string;\n  relationship: string;\n}\n\nexport interface WikiQueryResponseDto {\n  answer: string;\n  sources: WikiSourceDto[];\n  graphNodes: GraphNodeDto[];\n  graphEdges: GraphEdgeDto[];\n}\n", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/interfaces/gemini-prompts.interface.ts", "label": "gemini-prompts.interface.ts", "title": "<b>gemini-prompts.interface.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/interfaces/gemini-prompts.interface.ts", "content": "/**\n * Parameters for generating a simple task checklist.\n */\nexport interface ChecklistPromptParams {\n  taskName: string;\n  description?: string;\n  microTaskType?: string;\n}\n\n/**\n * Parameters for generating a task checklist with historical context.\n */\nexport interface ChecklistWithHistoryPromptParams extends ChecklistPromptParams {\n  historicalContext?: string;\n}\n\n/**\n * Parameters for generating PERT (Optimistic, Likely, Pessimistic) estimates.\n */\nexport interface PertEstimatePromptParams {\n  taskType: string;\n  description: string;\n  projectContext?: string;\n}\n\n/**\n * Parameters for generating completion feedback.\n */\nexport interface CompletionFeedbackPromptParams {\n  taskName: string;\n  taskDescription?: string;\n}\n\n/**\n * Parameters for generating next step suggestions.\n */\nexport interface NextStepsPromptParams {\n  taskName: string;\n  feedback?: string | Record<string, unknown> | null;\n}\n\n/**\n * Parameters for generating a set of task suggestions for a project.\n */\nexport inte", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/interfaces/index.ts", "label": "index.ts", "title": "<b>index.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/interfaces/index.ts", "content": "export * from './gemini-prompts.interface';\n", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/core/gemini.prompts.ts", "label": "gemini.prompts.ts", "title": "<b>gemini.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/core/gemini.prompts.ts", "content": "import {\n  ChecklistPromptParams,\n  ChecklistWithHistoryPromptParams,\n  CompletionFeedbackPromptParams,\n  NextStepsPromptParams,\n  PertEstimatePromptParams,\n  TaskSuggestionsPromptParams,\n} from '../../interfaces';\n\nexport function buildChecklistGenerationPrompt(params: ChecklistPromptParams): string {\n  const { taskName, description, microTaskType } = params;\n  return [\n    'Gere um checklist objetivo para uma micro-tarefa.',\n    `Tipo: ${microTaskType || 'generic'}`,\n    `Nome: ${taskName}`,\n    `Descricao: ${description || ''}`,\n    'Retorne APENAS um JSON array de strings com 3 a 8 itens, sem texto adicional.',\n  ].join('\\n');\n}\n\nexport function buildChecklistWithHistoryPrompt(params: ChecklistWithHistoryPromptParams): string {\n  const { taskName, description, microTaskType, historicalContext } = params;\n  return [\n    'Gere um checklist objetivo para uma micro-tarefa, baseado no histórico de tarefas similares.',\n    `Tipo: ${microTaskType || 'generic'}`,\n    `Nome: ${taskName}`,\n ", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/index.ts", "label": "index.ts", "title": "<b>index.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/index.ts", "content": "/**\n * Barrel re-exports for all AI prompt builder functions.\n * All functions here are pure (no NestJS dependency injection).\n */\n\n// Core Prompts\nexport * from './core/gemini.prompts';\n\n// Tasks Prompts\nexport * from './tasks/dependency.prompts';\nexport * from './tasks/feedback.prompts';\nexport * from './tasks/risk.prompts';\nexport * from './tasks/rtm.prompts';\n\n// Projects Prompts\nexport * from './projects/planning.prompts';\nexport * from './projects/wbs.prompts';\nexport * from './projects/rolling-wave.prompts';\nexport * from './projects/audit.prompts';\nexport * from './projects/monotony.prompts';\nexport * from './projects/microtask-outline.prompts';\nexport * from './projects/microtask-detail.prompts';\n", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/projects/audit.prompts.ts", "label": "audit.prompts.ts", "title": "<b>audit.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/projects/audit.prompts.ts", "content": "/**\n * Pure prompt builder functions for the WBS Audit domain.\n * Extracted from `src/projects/services/wbs/core/audit.service.ts`.\n * No NestJS decorators, no side effects — only string construction.\n */\n\nexport function buildAuditPrompt(params: {\n  projectName: string;\n  leafNodeName: string;\n  nodePath: string;\n  budgetHours: number;\n  generatedHours: number;\n  diffPct: number;\n  taskCount: number;\n  duplicateRatio: number;\n  topDuplicateKeys: string;\n  dupScore: number;\n  similarScore: number;\n  tasksPreview: string;\n}): string {\n  return (\n    `Você é um auditor de escopo e estimativas (WBS/PERT/EVM).\\n\\n` +\n    `Contexto do projeto: ${params.projectName}\\n` +\n    `Pacote (WBS leaf): \"${params.leafNodeName}\"\\n` +\n    `Caminho: ${params.nodePath}\\n` +\n    `Estimativa top-down do pacote: ${params.budgetHours.toFixed(1)}h\\n` +\n    `Estimativa bottom-up (micro-tarefas): ${params.generatedHours.toFixed(1)}h\\n` +\n    `Diferença: ${params.diffPct.toFixed(0)}%\\n\\n` +\n    `Sinais automátic", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/projects/microtask-detail.prompts.ts", "label": "microtask-detail.prompts.ts", "title": "<b>microtask-detail.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/projects/microtask-detail.prompts.ts", "content": "import { WBSNodeDto } from '../../../projects/dto/wbs.dto';\nimport { normalizeWorkflowTypes } from '../../../projects/services/wbs/utils/normalizers.util';\nimport { WBSLeafProjectContext } from '../../../projects/interfaces/drafts.interface';\n\nexport function buildMicroTaskDetailsPrompt(params: {\n  project?: WBSLeafProjectContext | null;\n  node: WBSNodeDto;\n  currentPath: string;\n  level: number;\n  targetMinutes: number;\n  outline: {\n    name: string;\n    microTaskType?: string;\n    themeTag?: string;\n    contextTag?: string;\n    cognitiveMode?: string;\n    pomodorosPlanned?: number;\n  };\n  plan?: {\n    themes?: Array<{ name: string; criteria?: string }>;\n    workflow?: string[];\n  };\n}): string {\n  const today = new Date().toISOString().split('T')[0];\n  const projectSummary = params.project?.smartObjective?.summary || params.project?.description || '';\n  const themes = (params.plan?.themes || [])\n    .map((t, i) => `${i + 1}. ${t.name}${t.criteria ? ` — ${t.criteria}` : ''}`)\n    .joi", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/projects/microtask-outline.prompts.ts", "label": "microtask-outline.prompts.ts", "title": "<b>microtask-outline.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/projects/microtask-outline.prompts.ts", "content": "import { WBSNodeDto } from '../../../projects/dto/wbs.dto';\nimport { normalizeWorkflowTypes } from '../../../projects/services/wbs/utils/normalizers.util';\nimport { WBSLeafProjectContext } from '../../../projects/interfaces/drafts.interface';\n\nexport function buildMicroTasksOutlinePrompt(params: {\n  project?: WBSLeafProjectContext | null;\n  node: WBSNodeDto;\n  currentPath: string;\n  level: number;\n  chunkMinutes: number[];\n  avoidTaskTitles?: string[];\n}): string {\n  const today = new Date().toISOString().split('T')[0];\n  const projectSummary = params.project?.smartObjective?.summary || params.project?.description || '';\n\n  const minutesList = JSON.stringify(params.chunkMinutes);\n\n  const avoidTitles = (params.avoidTaskTitles || [])\n    .map((t) => String(t || '').trim())\n    .filter(Boolean)\n    .slice(-20);\n  const avoidTitlesBlock = avoidTitles.length\n    ? `\\n\\nANTI-REPETIÇÃO (títulos já usados; NÃO repita nem gere muito similar):\\n${avoidTitles\n        .map((t, i) => `${i + 1}. ${", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/projects/monotony.prompts.ts", "label": "monotony.prompts.ts", "title": "<b>monotony.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/projects/monotony.prompts.ts", "content": "/**\n * Pure prompt builder functions for the WBS Monotony Fix domain.\n * Extracted from `src/projects/services/wbs/monotony/monotony-fix.service.ts`.\n * No NestJS decorators, no side effects — only string construction.\n */\n\nimport { MicroTaskDraft, WBSLeafProjectContext } from '../../../projects/interfaces';\nimport { WBSNodeDto } from '../../../projects/dto/wbs.dto';\nimport { extractVerb, templateTitle } from '../../../projects/services/wbs/utils/normalizers.util';\n\nexport function buildFixMonotonyPrompt(params: {\n  project: WBSLeafProjectContext | null | undefined;\n  node: WBSNodeDto;\n  currentPath: string;\n  chunkMinutes: number[];\n  drafts: MicroTaskDraft[];\n  indices: number[];\n  round: number;\n}): string {\n  const today = new Date().toISOString().split('T')[0];\n  const projectSummary = params.project?.smartObjective?.summary || params.project?.description || '';\n\n  const indicesText = params.indices.map((i) => i).join(', ');\n\n  const fixedTargets = params.indices\n    .map((idx) =>", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/projects/planning.prompts.ts", "label": "planning.prompts.ts", "title": "<b>planning.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/projects/planning.prompts.ts", "content": "/**\n * Pure prompt builder functions for the Planning/Catchball domain.\n * No NestJS decorators, no side effects — only string construction.\n */\n\nexport function buildCatchballQuestionsPrompt(projectData: {\n  projectName: string;\n  projectDescription: string;\n  shortTermGoal?: string;\n  midTermGoal?: string;\n  longTermGoal?: string;\n}): string {\n  const goalsContext: string[] = [];\n  if (projectData.shortTermGoal) goalsContext.push(`Curto prazo: ${projectData.shortTermGoal}`);\n  if (projectData.midTermGoal) goalsContext.push(`Médio prazo: ${projectData.midTermGoal}`);\n  if (projectData.longTermGoal) goalsContext.push(`Longo prazo: ${projectData.longTermGoal}`);\n\n  return `Você é um consultor de gestão de projetos especializado em metodologias PMBOK e PRINCE2.\n\nUm usuário tem um projeto com as seguintes informações:\n\nNome do Projeto: \"${projectData.projectName}\"\nDescrição: \"${projectData.projectDescription}\"\n${goalsContext.length > 0 ? `\\nObjetivos existentes:\\n${goalsContext.join('\\n')", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/projects/rolling-wave.prompts.ts", "label": "rolling-wave.prompts.ts", "title": "<b>rolling-wave.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/projects/rolling-wave.prompts.ts", "content": "/**\n * Pure prompt builder functions for Rolling Wave planning domain.\n * No NestJS decorators, no side effects — only string construction.\n */\n\nexport function buildPlanWaveStructurePrompt(params: {\n  projectName: string;\n  todayIso: string;\n  deadlineIso: string;\n  availableDays: number;\n  taskCount: number;\n  totalTaskHours: number;\n  dailyCapacityHours: number;\n}): string {\n  return `Você é especialista em Rolling Waves. Determine número ideal de ondas.\n\nPROJETO: ${params.projectName}\nData: ${params.todayIso} até ${params.deadlineIso}\nDias: ${params.availableDays} | Tarefas: ${params.taskCount} | Trabalho: ${params.totalTaskHours.toFixed(1)}h | Capacidade: ${params.dailyCapacityHours}h/dia\n\nRecomende ondas que cubram EXATAMENTE ${params.availableDays} dias (cada onda: 14-45 dias, total: 3-15 ondas).\n\nRETORNE APENAS JSON (SEM MARKDOWN, STRINGS EM UMA LINHA):\n{\"recommendedWaveCount\":NUMERO,\"totalDurationDays\":${params.availableDays},\"description\":\"Descrição breve em uma linha\",\"reaso", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/projects/wbs.prompts.ts", "label": "wbs.prompts.ts", "title": "<b>wbs.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/projects/wbs.prompts.ts", "content": "/**\n * Pure prompt builder functions for WBS domain.\n * No NestJS decorators, no side effects — only string construction.\n */\n\nexport function buildWbsGenerationPrompt(smartObjective: {\n  specific: string;\n  measurable: string;\n  achievable: string;\n  relevant: string;\n  temporal: string;\n  weeklyHours?: number;\n  budgetHours?: number;\n  weeksAvailable?: number;\n  summary?: string;\n}): string {\n  const hasBudgetContext =\n    Number.isFinite(Number(smartObjective.budgetHours)) && Number(smartObjective.budgetHours) > 0;\n  const weeklyHours = Number(smartObjective.weeklyHours);\n  const weeksAvailable = Number(smartObjective.weeksAvailable);\n\n  return `Você é um consultor de gestão de projetos especializado em WBS (Work Breakdown Structure) segundo PMBOK.\n\nBaseado no objetivo SMART abaixo, gere uma WBS hierárquica CONCISA para o projeto.\n\nObjetivo SMART:\n- Específico: ${smartObjective.specific}\n- Mensurável: ${smartObjective.measurable}\n- Atingível: ${smartObjective.achievable}\n- Relevante", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/tasks/dependency.prompts.ts", "label": "dependency.prompts.ts", "title": "<b>dependency.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/tasks/dependency.prompts.ts", "content": "/**\n * Pure prompt builder functions for Task Dependency Inference.\n * Extracted from `src/tasks/services/dependencies/dependency-inference.service.ts`.\n * No NestJS decorators, no side effects — only string construction.\n */\n\nimport {\n  InferenceTask,\n  InferenceLeafGates,\n} from '../../../tasks/interfaces/dependency-inference.interface';\nimport { truncateText } from '../../../tasks/services/dependencies/utils/dependency-inference.utils';\n\nexport function buildInferWithAiPrompt(params: {\n  hardMaxEdges: number;\n  wbsPath?: string;\n  leafName?: string;\n  tasks: InferenceTask[];\n}): string {\n  return [\n    'Você é um assistente de gerenciamento de projetos. Sua tarefa é sugerir dependências entre micro-tarefas.',\n    'Objetivo: construir um DAG (sem ciclos) com dependências MINIMAIS e REALISTAS, preservando PARALelismo quando possível.',\n    'Regras:',\n    `- Retorne no máximo ${params.hardMaxEdges} dependências.`,\n    '- Evite criar uma cadeia linear com todas as tasks; só crie dependê", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/tasks/feedback.prompts.ts", "label": "feedback.prompts.ts", "title": "<b>feedback.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/tasks/feedback.prompts.ts", "content": "/**\n * Pure prompt builder functions for the Task Completion Feedback domain.\n * Extracted from `src/tasks/services/intelligence/feedback.service.ts`.\n * No NestJS decorators, no side effects — only string construction.\n */\n\nexport function buildFeedbackPrompt(params: {\n  taskName: string;\n  taskDescription?: string;\n  percent: number;\n  checklistLength: number;\n  timeSpentMinutes?: number;\n}): string {\n  return [\n    'Você é um receptor de bola (catchball) que fornece feedback curto e acionável quando uma tarefa é concluída.',\n    `Tarefa: ${String(params.taskName || '')}`,\n    params.taskDescription ? `Descrição: ${String(params.taskDescription)}` : '',\n    `Checklist completion: ${params.percent}% (${params.checklistLength} items)`,\n    params.timeSpentMinutes ? `Tempo gasto (minutos): ${params.timeSpentMinutes}` : '',\n    '',\n    'Gere um JSON válido com exatamente essas chaves (strings):',\n    '- celebration: uma frase curta parabenizando e reconhecendo o esforço',\n    '- validati", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/tasks/risk.prompts.ts", "label": "risk.prompts.ts", "title": "<b>risk.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/tasks/risk.prompts.ts", "content": "/**\n * Pure prompt builder functions for the Risk Assessment domain.\n * No NestJS decorators, no side effects — only string construction.\n */\n\nexport function buildRiskAssessmentPrompt(projectDescription: string): string {\n  return `Você é um especialista em gerenciamento de projetos. \nAnalise a descrição do projeto e identifique os principais riscos.\n\nDescrição do Projeto:\n${projectDescription}\n\nRetorne um JSON com um array de riscos. Cada risco deve ter:\n- description (string): descrição clara do risco\n- probability (number): probabilidade de 0-100 (%)\n- impact (number): impacto de 1-5\n- severity (string): 'baixa', 'média' ou 'alta' (baseado em probability * impact / 5)\n- mitigationPlan (string): plano inicial de mitigação\n\nExemplo de resposta:\n{\n  \"risks\": [\n    {\n      \"description\": \"Falta de recursos técnicos especializados\",\n      \"probability\": 40,\n      \"impact\": 4,\n      \"severity\": \"média\",\n      \"mitigationPlan\": \"Contratar consultoria externa ou treinar equipe com antecedê", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/prompts/tasks/rtm.prompts.ts", "label": "rtm.prompts.ts", "title": "<b>rtm.prompts.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/prompts/tasks/rtm.prompts.ts", "content": "/**\n * Pure prompt builder functions for the RTM (Requirements Traceability Matrix) domain.\n * Extracted from `src/tasks/services/traceability/utils/rtm-ai.utils.ts`.\n * No NestJS decorators, no side effects — only string construction.\n */\n\nexport function buildGenerateRequirementsPrompt(\n  smartObjective: Record<string, string | undefined>,\n): string {\n  return `Você é um planejador de desenvolvimento pessoal.\n \nObjetivo:\nGerar uma estrutura rastreável no formato objetivo -> hábito -> etapa -> ação.\n \nRegras:\n- Foque em projetos pessoais (aprendizado, rotina, hábitos, produtividade).\n- Gere uma árvore prática e rastreável.\n- Retorne entre 10 e 24 itens no total.\n- Cada item deve ter:\n\\t- ref: identificador curto único (ex: O1, H1, E1, A1)\n\\t- parentRef: referência do pai (null apenas para objective)\n\\t- kind: objective | habit | stage | action\n\\t- description: descrição clara, específica e mensurável\n- Ações devem ser executáveis (o que fazer de fato).\n- Sem markdown.\n \nSmart Objectiv", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/services/core/gemini-executor.service.ts", "label": "gemini-executor.service.ts", "title": "<b>gemini-executor.service.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/services/core/gemini-executor.service.ts", "content": "import { Injectable } from '@nestjs/common';\nimport { ConfigService } from '@nestjs/config';\nimport { GoogleGenerativeAI, HarmBlockThreshold, HarmCategory } from '@google/generative-ai';\n\n@Injectable()\nexport class GeminiExecutorService {\n  private readonly genAI: GoogleGenerativeAI;\n  private readonly model: string;\n  private readonly strongModel?: string;\n  private readonly strongModelMaxCallsPerDay: number;\n  private strongModelCallsDay = '';\n  private strongModelCallsUsed = 0;\n  private warnedStrongBudget = false;\n  private readonly embeddingModel?: string;\n  private readonly jsonModeForced: boolean | null;\n  private embeddingDisabled = false;\n  private warnedEmbedding = false;\n  private warnedJsonMode = false;\n\n  constructor(private readonly configService: ConfigService) {\n    const apiKey =\n      this.configService.get<string>('GEMINI_API_KEY') ||\n      this.configService.get<string>('GOOGLE_API_KEY') ||\n      process.env.GEMINI_API_KEY ||\n      process.env.GOOGLE_API_KEY;\n\n    i", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/services/core/gemini.service.ts", "label": "gemini.service.ts", "title": "<b>gemini.service.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/services/core/gemini.service.ts", "content": "import { Injectable } from '@nestjs/common';\nimport { GeminiExecutorService } from './gemini-executor.service';\nimport { ChecklistAiService } from '../tasks/checklist-ai.service';\nimport { PertAiService } from '../tasks/pert-ai.service';\nimport { SuggestionsAiService } from '../tasks/suggestions-ai.service';\nimport { DependencyAiService } from '../tasks/dependency-ai.service';\nimport {\n  ChecklistPromptParams,\n  ChecklistWithHistoryPromptParams,\n  CompletionFeedbackPromptParams,\n  NextStepsPromptParams,\n  PertEstimatePromptParams,\n  TaskSuggestionsPromptParams,\n} from '../../interfaces';\n\n@Injectable()\nexport class GeminiService {\n  constructor(\n    private readonly geminiExecutor: GeminiExecutorService,\n    private readonly checklistAiService: ChecklistAiService,\n    private readonly pertAiService: PertAiService,\n    private readonly suggestionsAiService: SuggestionsAiService,\n    private readonly dependencyAiService: DependencyAiService,\n  ) {}\n\n  generateChecklistForTask(params: Che", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/services/projects/prompt-builder.service.ts", "label": "prompt-builder.service.ts", "title": "<b>prompt-builder.service.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/services/projects/prompt-builder.service.ts", "content": "import { Injectable } from '@nestjs/common';\nimport { WBSNodeDto } from '../../../projects/dto/wbs.dto';\nimport * as prompts from '../../prompts';\n\n/**\n * Service for building AI prompts for WBS and micro-task generation\n */\n@Injectable()\nexport class PromptBuilderService {\n  buildMicroTasksOutlinePrompt(params: {\n    project: any;\n    node: WBSNodeDto;\n    currentPath: string;\n    level: number;\n    chunkMinutes: number[];\n    avoidTaskTitles?: string[];\n  }): string {\n    return prompts.buildMicroTasksOutlinePrompt(params);\n  }\n\n  buildMicroTasksOutlineWithPlanPrompt(params: {\n    project: any;\n    node: WBSNodeDto;\n    currentPath: string;\n    level: number;\n    chunkMinutes: number[];\n    avoidTaskTitles?: string[];\n    plan: {\n      themes?: Array<{ name: string; criteria?: string }>;\n      workflow?: string[];\n iWikiService.name);\n  private nodes: GraphNodeData[] = [];\n  private edges: GraphEdgeData[] = [];\n  private vectorItems: VectorItemData[] = [];\n  private genAI: GoogleGenerativeAI | null = null;\n\n  constructor(private readonly", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/utils/json-sanitizer.util.ts", "label": "json-sanitizer.util.ts", "title": "<b>json-sanitizer.util.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/ai/utils/json-sanitizer.util.ts", "content": "import { Logger } from '@nestjs/common';\n\nexport function sanitizeJSON(jsonString: string): string {\n  try {\n    let result = jsonString.trim();\n    const chars: string[] = [];\n    let inString = false;\n    let escapeNext = false;\n\n    for (let i = 0; i < result.length; i++) {\n      const char = result[i];\n\n      if (escapeNext) {\n        chars.push(char);\n        escapeNext = false;\n        continue;\n      }\n\n      if (char === '\\\\') {\n        chars.push(char);\n        escapeNext = true;\n        continue;\n      }\n\n      if (char === '\"' && (i === 0 || result[i - 1] !== '\\\\')) {\n        inString = !inString;\n        chars.push(char);\n        continue;\n      }\n\n      if (inString && (char === '\\n' || char === '\\r')) {\n        chars.push(' ');\n        continue;\n      }\n\n      chars.push(char);\n    }\n\n    result = chars.join('');\n    result = result.replace(/,\\s*}/g, '}');\n    result = result.replace(/,\\s*]/g, ']');\n\n    result = result.replace(/\"([^\"]*?)(['\"])([^\"]*?)\"/g, (match, _prefix", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/ai/utils/ label": "index.ts", "title": "<b>index.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/projects/services/wbs/utils/index.ts", "content": "/**\n * Barrel exports for WBS utils\n */\n\nexport * from './json-parser.util';\nexport * from './metrics-calculator.util';\nexport * from './normalizers.util';\nexport * from './wbs-helpers.util';\n", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/projects/services/wbs/utils/json-parser.util.ts", "label": "json-parser.util.ts", "title": "<b>json-parser.util.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/projects/services/wbs/utils/json-parser.util.ts", "content": "/**\n * Utilities for parsing and cleaning JSON responses from AI (Gemma-compatible)\n */\n\n/** Strip markdown fences and isolate JSON content. */\nfunction cleanMarkdown(response: string): string {\n  let s = response.trim();\n  // Remove markdown code fences\n  s = s.replace(/^```(?:json)?\\s*/i, '').replace(/\\s*```$/i, '');\n  return s.trim();\n}\n\n/**\n * Aggressive JSON repair for Gemma/open-source models that produce almost-valid JSON.\n * Handles: trailing commas, unquoted/single-quoted keys, escaped newlines, smart quotes,\n * control chars, duplicate commas, and other common LLM JSON quirks.\n */\nexport function repairJsonString(raw: string): string {\n  let s = raw;\n\n  // Normalize smart/curly quotes\n  s = s.replace(/[\\u201C\\u201D\\u00AB\\u00BB]/g, '\"');\n  s = s.replace(/[\\u2018\\u2019\\u2032]/g, \"'\");\n\n  // Remove control characters except \\t \\n \\r\n  // eslint-disable-next-line no-control-regex\n  s = s.replace(/[\\x00-\\x08\\x0B\\x0C\\x0E-\\x1F\\x7F]/g, ' ');\n\n  // Normalize literal escaped newline se", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/projects/services/wbs/utils/metrics-calculator.util.ts", "label": "metrics-calculator.util.ts", "title": "<b>metrics-calculator.util.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/projects/services/wbs/utils/metrics-calculator.util.ts", "content": "import {\n  MICRO_TASK_MIN_MINUTES,\n  MICRO_TASK_HARD_MAX_MINUTES,\n  MICRO_TASK_MAX_PER_LEAF,\n} from '../constants/wbs.constants';\nimport {\n  normalizeTitle,\n  templateTitle,\n  extractVerb,\n  normalizePreferredPomodoros,\n} from './normalizers.util';\nimport { WBSNodeDto } from '../../../dto/wbs.dto';\nimport {\n  PertCalculationResult,\n  BatchMetricInputTask,\n  BatchMetricsOptions,\n  BatchMetricsResult,\n  ChunkMinutesParams,\n  RefineChunksParams,\n} from '../../../interfaces';\n\n// Compute PERT estimates from minutes\nexport function computePertFromMinutes(minutes: number): PertCalculationResult {\n  const base = Math.max(5, Math.round(minutes));\n  const optimistic = Math.max(5, Math.round(base * 0.75));\n  const mostLikely = Math.max(optimistic, base);\n  const pessimistic = Math.max(mostLikely, Math.round(base * 1.5));\n  const expected = Math.round((optimistic + 4 * mostLikely + pessimistic) / 6);\n  const variance = Number(Math.pow((pessimistic - optimistic) / 6, 2).toFixed(2));\n\n  return { op", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/projects/services/wbs/utils/normalizers.util.ts", "label": "normalizers.util.ts", "title": "<b>normalizers.util.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/projects/services/wbs/utils/normalizers.util.ts", "content": "/**\n * Normalization utilities for task properties and text\n */\n\nimport { MICRO_TASK_PREFERRED_MINUTES } from '../constants/wbs.constants';\n\n/**\n * Normalize preferred pomodoros value (1-3 range)\n */\nexport function normalizePreferredPomodoros(value?: number): number {\n  const v = Number(value);\n  if (!Number.isFinite(v)) return Math.ceil(MICRO_TASK_PREFERRED_MINUTES / 25);\n  return Math.max(1, Math.min(3, Math.round(v)));\n}\n\n/**\n * Normalize title for comparison (remove numbers, special chars, etc)\n */\nexport function normalizeTitle(title?: string): string {\n  if (!title) return '';\n  const withoutParens = stripParentheses(title.toLowerCase());\n  return withoutParens\n    .replace(/[0-9]+/g, '')\n    .replace(/[^a-z\\u00c0-\\u017f\\s]/gi, ' ')\n    .replace(/\\s+/g, ' ')\n    .trim();\n}\n\n/**\n * Remove parenthetical contents without regex (ReDoS safe)\n */\nfunction stripParentheses(str: string): string {\n  let result = '';\n  let depth = 0;\n  for (let i = 0; i < str.length; i++) {\n    const char", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/projects/services/wbs/utils/task-conversion-helpers.util.ts", "label": "task-conversion-helpers.util.ts", "title": "<b>task-conversion-helpers.util.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/projects/services/wbs/utils/task-conversion-helpers.util.ts", "content": "import { createHash } from 'crypto';\nimport { WBSNodeDto } from '../../../dto/wbs.dto';\nimport { computePertFromMinutes, computeChunkMinutes } from './metrics-calculator.util';\nimport {\n  GeneratedTaskDto,\n  Task,\n  ShrinkTaskInput,\n  ShrinkResult,\n  LegacyGeneratedTask,\n  DraftToTaskContext,\n  DraftsWithPlanCacheParams,\n  MapDraftsToTasksParams,\n  GenerateFallbackTasksParams,\n  MicroTaskDraft,\n} from '../../../interfaces';\n\nexport function hashKey(input: unknown): string {\n  cons scription) return undefined;\n\n  const m", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/settings/dto/update-settings.dto.ts", "label": "update-settings.dto.ts", "title": "<b>update-settings.dto.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/settings/dto/update-settings.dto.ts", "content": "import { IsBoolean, IsNumber, IsOptional } from 'class-validator';\n\nexport class UpdateSettingsDto {\n  @IsOptional()\n  @IsBoolean()\n  silenceNotifications?: boolean;\n\n  @IsOptional()\n  @IsBoolean()\n  darkMode?: boolean;\n\n  @IsOptional()\n  @IsBoolean()\n  soundEnabled?: boolean;\n\n  @IsOptional()\n  @IsNumber()\n  notificationTimeBeforeDueMinutes?: number;\n}\n", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/settings/settings.controller.ts", "label": "settings.controller.ts", "title": "<b>settings.controller.ts</b><br/><i>controller</i>", "group": "controller", "path": "Backend/src/settings/settings.controller.ts", "content": "import { Controller, Get, Patch, Post, Body, Param } from '@nestjs/common';\nimport { SettingsService } from './settings.service';\nimport { UpdateSettingsDto } from './dto/update-settings.dto';\nimport { Settings } from './settings.schema';\nimport { ApiOperation, ApiTags } from '@nestjs/swagger';\n\n@ApiTags('settings')\n@Controller('settings')\nexport class SettingsController {\n  constructor(private readonly settingsService: SettingsService) {}\n\n  @Get(':userId')\n  @ApiOperation({ summary: 'Get user settings' })\n  async getSettings(@Param('userId') userId: string): Promise<Settings> {\n    return this.settingsService.getSettings(userId);\n  }\n\n  @Patch(':userId')\n  @ApiOperation({ summary: 'Update user settings' })\n  async updateSettings(\n    @Param('userId') userId: string,\n    @Body() updateDto: UpdateSettingsDto,\n  ): Promise<Settings> {\n    return this.settingsService.updateSettings(userId, updateDto);\n  }\n\n  @Post(':userId/toggle-silence-notifications')\n  @ApiOperation({ summary: 'Toggle", "color": { "background": "#10b981", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/settings/settings.module.ts", "label": "settings.module.ts", "title": "<b>settings.module.ts</b><br/><i>module</i>", "group": "module", "path": "Backend/src/settings/settings.module.ts", "content": "import { Module } from '@nestjs/common';\nimport { MongooseModule } from '@nestjs/mongoose';\nimport { Settings, SettingsSchema } from './settings.schema';\nimport { SettingsService } from './settings.service';\nimport { SettingsController } from './settings.controller';\n\n@Module({\n  imports: [MongooseModule.forFeature([{ name: Settings.name, schema: SettingsSchema }])],\n  controllers: [SettingsController],\n  providers: [SettingsService],\n  exports: [SettingsService],\n})\nexport class SettingsModule {}\n", "color": { "background": "#ec4899", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 26 }, { "id": "Backend/src/settings/settings.schema.ts", "label": "settings.schema.ts", "title": "<b>settings.schema.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/settings/settings.schema.ts", "content": "import { Schema, Prop, SchemaFactory } from '@nestjs/mongoose';\nimport { Document } from 'mongoose';\n\n@Schema({ collection: 'settings', timestamps: true })\nexport class Settings extends Document {\n  @Prop({ required: true })\n  userId: string;\n\n  @Prop({ default: false })\n  silenceNotifications: boolean;\n\n  @Prop({ default: false })\n  darkMode: boolean;\n\n  @Prop({ default: false })\n  soundEnabled: boolean;\n\n  @Prop({ default: 10 })\n  notificationTimeBeforeDueMinutes: number;\n\n  createdAt?: Date;\n  updatedAt?: Date;\n}\n\nexport const SettingsSchema = SchemaFactory.createForClass(Settings);\nSettingsSchema.index({ userId: 1 });\n", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/settings/settings.service.ts", "label": "settings.service.ts", "title": "<b>settings.service.ts</b><br/><i>service</i>", "group": "service", "path": "Backend/src/settings/settings.service.ts", "content": "import { Injectable } from '@nestjs/common';\nimport { InjectModel } from '@nestjs/mongoose';\nimport { Model } from 'mongoose';\nimport { Settings } from './settings.schema';\nimport { UpdateSettingsDto } from './dto/update-settings.dto';\n\n@Injectable()\nexport class SettingsService {\n  constructor(@InjectModel(Settings.name) private settingsModel: Model<Settings>) {}\n\n  async getSettings(userId: string): Promise<Settings> {\n    let settings = await this.settingsModel.findOne({ userId });\n    if (!settings) {\n      settings = await this.settingsModel.create({\n        userId,\n        silenceNotifications: false,\n        darkMode: false,\n        soundEnabled: true,\n        notificationTimeBeforeDueMinutes: 10,\n      });\n    }\n    return settings;\n  }\n\n  async updateSettings(userId: string, updateDto: UpdateSettingsDto): Promise<Settings> {\n    const settings = await this.settingsModel.findOneAndUpdate(\n      { userId: String(userId) },\n      { $set: updateDto },\n      {\n        new: true,\n  ", "color": { "background": "#3b82f6", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/tasks/controllers/alerts.controller.ts", "label": "alerts.controller.ts", "title": "<b>alerts.controller.ts</b><br/><i>controller</i>", "group": "controller", "path": "Backend/src/tasks/controllers/alerts.controller.ts", "content": "import { Controller, Get, Patch, Param, Query } from '@nestjs/common';\nimport { ApiOperation, ApiResponse, ApiTags } from '@nestjs/swagger';\nimport { AlertsService } from '../services/monitoring';\n\n@ApiTags('alerts')\n@Controller('alerts')\nexport class AlertsController {\n  constructor(private readonly alertsService: AlertsService) {}\n\n  @Get()\n  @ApiOperation({ summary: 'List alerts (optionally unread only)' })\n  @ApiResponse({ status: 200, description: 'Alerts returned.' })\n  async listAlerts(\n    @Query('userId') userId?: string,\n    @Query('unread') unread?: string,\n    @Query('projectId') projectId?: string,\n  ) {\n    const unreadOnly = String(unread || '').toLowerCase() === 'true';\n    return this.alertsService.listAlerts({\n      userId,\n      unreadOnly,\n      projectId,\n      limit: 50,\n    });\n  }\n\n  @Patch(':id/read')\n  @ApiOperation({ summary: 'Mark alert as read' })\n  @ApiResponse({ status: 200, description: 'Alert marked as read.' })\n  async markRead(@Param('id') id: string,", "color": { "background": "#10b981", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/tasks/controllers/buffer.controller.ts", "label": "buffer.controller.ts", "title": "<b>buffer.controller.ts</b><br/><i>controller</i>", "group": "controller", "path": "Backend/src/tasks/controllers/buffer.controller.ts", "content": "import { Controller, Get, Post, Param, Body, Logger } from '@nestjs/common';\nimport { ApiTags, ApiOperati  CalculateCriticalPathResponseDto,\n  GetDependenciesResponseDto,\n  AutoInferDependenciesResponseDto,\n  TaskMetricsResponseDto,\n  UpsertDependencyDto,\n} from '../dto';\n\n@ApiTags('CPM - Critical Path Method')\n@ApiBearerAuth()\n@Controller('tasks')\nexport class CPMController {\n  private readonly logger = new Logger(CPMController.name);\n\n  constructor(\n    private readonly cpmService: CPMService,\n ", "color": { "background": "#10b981", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidth": 2, "size": 16 }, { "id": "Backend/src/tasks/controllers/habits.controller.ts", "label": "habits.controller.ts", "title": "<b>habits.controller.ts</b><br/><i>controller</i>", "group": "controller", "path": "Backend/src/tasks/controllers/habits.controller.ts", "content": "import { Controller, Get, Query } from '@nestjs/common';\nimport { ApiOperation, ApiResponse, ApiTags } from '@nestjs/swagger';\nimport { GetHabitsDashboardDto } from '../dto/monitoring/get-habits-dashboard.dto';\nimport { GetHabitsDashboardResponseDto } from '../dto/monitoring/habits-dashboard.dto';\nimport { TasksService } from '../tasks.service';\n\n@ApiTags('habits')\n@Controller('habits')\nexport class HabitsController {\n  constructor(private readonly tasksService: TasksService) {}\n\n  @Get('dashboard')\n  @ApiOperation({ summary: 'Retorna dashboard de hábitos e streaks' })\n  @ApiResponse({\n    status: 200,\n    description: 'Dashboard retornado com sucesso.',\n    type: GetHabitsDashboardResponseDto,\n  })\n  async getHabitsDashboard(\n    @Query() query: GetHabitsDashboardDto,\n  ): Promise<GetHabitsDashboardResponseDto> {\n    return this.tasksService.getHabitsDashboard(query);\n  }\n}\n", "color": { "background": "#10b981", "border": "#ffffff", "highlight": { "background": "#f43f5e", "border": "#ffffff" } }, "font": { "color": "#ffffff", "size": 12, "face": "system-ui" }, "borderWidt     const nodeMap = new Map(rawNodes.map(n => [n.id, n]));

    let hideIsolated = true;
    let isHierarchical = false;

    function getFilteredNodes() {
      if (!hideIsolated) return rawNodes;
      return rawNodes.filter(n => (degreeMap.get(n.id) || 0) > 0);
    }

    const container = document.getElementById('mynetwork');
    let nodesDataSet = new vis.DataSet(getFilteredNodes());
    let edgesDataSet = new vis.DataSet(rawEdges);

    const data = { nodes: nodesDataSet, edges: edgesDataSet };

    const organicPhysics = {
      solver: 'barnesHut',
      barnesHut: {
        gravitationalConstant: -18000,
        centralGravity: 0.05,
        springLength: 260,
        springConstant: 0.02,
        damping: 0.15,
        avoidOverlap: 1
      },
      stabilization: { iterations: 200 }
    };

    const options = {
      nodes: {
        shape: 'dot',
        font: { size: 12, color: '#f9fafb' }
      },
      edges: {
        width: 2,
        selectionWidth: 4,
        hoverWidth: 3,
        smooth: false
      },
      physics: organicPhysics,
      interaction: { hover: true, tooltipDelay: 100 }
    };

    const network = new vis.Network(container, data, options);
    const sidePanel = document.getElementById('side-panel');
    const panelBody = document.getElementById('panel-body');

    updateStats();

    network.on('selectNode', function (params) {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const node = nodeMap.get(nodeId);
        if (node) showDetails(node);
      }
    });

    network.on('deselectNode', function () {
      closePanel();
    });

    function toggleIsolated() {
      hideIsolated = !hideIsolated;
      const btn = document.getElementById('btn-isolated');
      if (hideIsolated) {
        btn.classList.add('active');
        btn.innerHTML = '<span>👁️</span> Ocultar Isolados';
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '<span>👁️</span> Mostrar Todos';
      }
      nodesDataSet.clear();
      nodesDataSet.add(getFilteredNodes());
      updateStats();
    }

    function toggleLayout() {
      isHierarchical = !isHierarchical;
      const btn = document.getElementById('btn-layout');
      if (isHierarchical) {
        btn.classList.add('active');
        btn.innerHTML = '<span>🌌</span> Layout Orgânico';
        network.setOptions({
          layout: { hierarchical: { direction: 'UD', sortMethod: 'directed', nodeSpacing: 180, levelSeparation: 150 } },
          physics: { enabled: false }
        });
      } else {
        btn.classList.remove('active');
        btn.innerHTML = '<span>🌲</span> Layout Hierárquico';
        network.setOptions({
          layout: { hierarchical: { enabled: false } },
          physics: organicPhysics
        });
      }
    }

    function updateStats() {
      const activeCount = nodesDataSet.length;
      document.getElementById('graph-stats').innerText = `${activeCount} nós visíveis (de ${rawNodes.length}) • ${rawEdges.length} conexões`;
    }

    function showDetails(node) {
      sidePanel.classList.add('active');
      const typeClass = 'type-' + node.group;
      const connectedEdges = rawEdges.filter(e => e.from === node.id || e.to === node.id);

      const neighbors = connectedEdges.map(e => {
        const isSource = e.from === node.id;
        const otherId = isSource ? e.to : e.from;
        const direction = isSource ? '➡️' : '⬅️';
        return `<li style="margin-bottom:4px;">${direction} <b style="color:#60a5fa;">${e.label}</b>: ${otherId}</li>`;
      }).join('');

      panelBody.innerHTML = `
        <span class="type-tag ${typeClass}">${node.group}</span>
        <h3 style="margin: 8px 0 4px 0; color:#fff;">${node.label}</h3>
        <p style="font-size:11px; color:#9ca3af; word-break:break-all; margin:0 0 16px 0;">${node.path}</p>
        
        <h4 style="margin:8px 0 4px 0; color:#38bdf8;">Conexões (${connectedEdges.length}):</h4>
        <ul style="padding-left:16px; margin:0 0 16px 0; font-size:11px; color:#d1d5db;">${neighbors || 'Nenhuma conexão direta'}</ul>

        <h4 style="margin:8px 0 4px 0; color:#38bdf8;">Conteúdo / Snippet:</h4>
        <div class="content-box">${escapeHtml(node.content)}</div>
      `;
    }

    function closePanel() {
      sidePanel.classList.remove('active');
    }

    function escapeHtml(str) {
      if (!str) return '';
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function searchNode(query) {
      if (!query.trim()) return;
      const found = getFilteredNodes().find(n => n.label.toLowerCase().includes(query.toLowerCase()));
      if (found) {
        network.focus(found.id, { scale: 1.4, animation: true });
        network.selectNodes([found.id]);
        showDetails(found);
      }
    }
