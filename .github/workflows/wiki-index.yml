name: LLM Wiki Indexing

on:
  push:
    branches:
      - main
      - develop
    paths:
      - "docs/**"
      - "Project/**"
      - "Backend/src/**/README.md"
      - "Backend/scripts/index-wiki.ts"

jobs:
  index-wiki:
    name: 🧠 Index LLM Knowledge Base
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🧠 Run Knowledge Base Indexer
        run: npm run wiki:index
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: 📤 Upload Knowledge Base Data Artifact
        uses: actions/upload-artifact@v7
        with:
          name: wiki-knowledge-base
          path: Backend/src/ai/data/
          retention-days: 30
