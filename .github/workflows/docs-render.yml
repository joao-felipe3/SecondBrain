name: Documentation & Diagrams Render

on:
  push:
    paths:
      - "docs/**.mmd"
      - "docs/**.md"
      - "Project/**.md"
  pull_request:
    paths:
      - "docs/**.mmd"
      - "docs/**.md"
      - "Project/**.md"

jobs:
  render-mermaid:
    name: 🎨 Render Mermaid Diagrams
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: 🧜 Render Mermaid Diagrams
        run: |
          shopt -s globstar nullglob
          files=(docs/**/*.mmd)
          if [ ${#files[@]} -gt 0 ]; then
            for file in "${files[@]}"; do
              echo "Rendering $file..."
              npx @mermaid-js/mermaid-cli -i "$file" -o "${file%.mmd}.svg"
            done
          else
            echo "No .mmd files found to render."
          fi
        continue-on-error: true

      - name: 📊 Check diagram compilation
        run: echo "✅ Mermaid diagrams rendered successfully or validated."
