name: Security Scan

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
  schedule:
    # Run every Monday at 07:00 UTC
    - cron: "0 7 * * 1"

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. Dependency vulnerability audit (npm audit)
  # ─────────────────────────────────────────────────────────────────────────────
  dependency-audit:
    name: 🔒 Dependency Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔍 Run npm audit (high + critical)
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 📊 Generate audit report
        run: npm audit --json > audit-report.json || true

      - name: 📤 Upload audit report
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: Backend/audit-report.json
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. Secret scanning with TruffleHog
  # ─────────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: 🕵️ Secret Scanning (TruffleHog)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history for secret scanning

      - name: 🔑 Run TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          # For push events: scan only the new commits in this push
          # For PRs: scan between base and head of the PR
          # For schedule/dispatch: scan full repo (no base/head)
          base: ${{ github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || '' }}
          head: ${{ github.event_name == 'push' && github.sha || '' }}
          extra_args: --only-verified

  # ─────────────────────────────────────────────────────────────────────────────
  # 2b. Fast Secret scanning with Gitleaks
  # ─────────────────────────────────────────────────────────────────────────────
  gitleaks-scan:
    name: 🛡️ Secret Scanning (Gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🔐 Run Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. Static Application Security Testing (CodeQL)
  # ─────────────────────────────────────────────────────────────────────────────
  codeql-analysis:
    name: 🔬 CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔧 Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: 📚 Install dependencies (Backend)
        run: npm ci
        working-directory: Backend

      - name: 🔨 Build project
        run: npm run build
        working-directory: Backend
        env:
          NODE_ENV: production

      - name: 🔬 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. Dependency license compliance check
  # ─────────────────────────────────────────────────────────────────────────────
  license-check:
    name: 📜 License Compliance
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: Backend/package-lock.json

      - name: 📚 Install dependencies
        run: npm ci

      - name: 🔧 Install license-checker
        run: npm install -g license-checker

      - name: 📜 Check licenses
        run: |
          license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;CC0-1.0;Unlicense;Python-2.0;CC-BY-3.0;CC-BY-4.0;0BSD' \
            --excludePrivatePackages \
            --json > license-report.json || true
          echo "✅ License check completed"

      - name: 📤 Upload license report
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: Backend/license-report.json
          retention-days: 30
